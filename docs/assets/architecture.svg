<svg width="1200" height="830" viewBox="0 0 1200 830" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartograph hexagonal architecture: REST adapter, application core, and driven adapters for GitHub ingestion, tree-sitter parsing, and SQLite persistence">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1200" height="830" fill="url(#bg2)"/>
  <text x="600" y="46" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#E9EFF9">Cartograph — Hexagonal Architecture</text>
  <text x="600" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7E8DA8">Java 17 · Spring Boot 3.5 · tree-sitter · SQLite · Flyway</text>

  <!-- client -->
  <rect x="60" y="110" width="230" height="70" rx="10" fill="#111C30" stroke="#2A3C61"/>
  <text x="175" y="140" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#E9EFF9">Client</text>
  <text x="175" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7E8DA8">curl · browser · CI</text>
  <line x1="175" y1="180" x2="175" y2="228" stroke="#64748B" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="187" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8AA0C4">POST /api/v1/index</text>

  <!-- api adapter -->
  <rect x="60" y="232" width="230" height="120" rx="10" fill="#111C30" stroke="#2A3C61"/>
  <text x="175" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#9FD8CE">api</text>
  <text x="175" y="276" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#7E8DA8">REST adapter (driving)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#A9B7D0" text-anchor="middle">
    <text x="175" y="300">IndexController</text>
    <text x="175" y="318">ApiExceptionHandler</text>
    <text x="175" y="336">request / response records</text>
  </g>

  <!-- legend -->
  <rect x="340" y="110" width="380" height="120" rx="10" fill="#0F1B31" stroke="#1E2D4D"/>
  <text x="360" y="138" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#A9B7D0">Legend</text>
  <line x1="360" y1="158" x2="392" y2="158" stroke="#64748B" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="402" y="162" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7E8DA8">synchronous call</text>
  <line x1="360" y1="184" x2="392" y2="184" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="402" y="188" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7E8DA8">driven port interface</text>
  <rect x="360" y="198" width="30" height="14" rx="4" fill="#111C30" stroke="#2A3C61"/>
  <text x="402" y="209" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7E8DA8">module (Java package)</text>

  <!-- response card -->
  <rect x="880" y="110" width="260" height="250" rx="10" fill="#111C30" stroke="#2A3C61"/>
  <text x="895" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#9FD8CE">GraphSnapshotResponse</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A9B7D0">
    <text x="895" y="167">repository</text>
    <text x="895" y="188">commitSha</text>
    <text x="895" y="209">nodes[ ]</text>
    <text x="895" y="230">edges[ ]</text>
    <text x="895" y="251">warnings[ ]</text>
    <text x="895" y="272">metrics {</text>
    <text x="913" y="291">filesSeen · filesParsed</text>
    <text x="913" y="310">nodes · edges</text>
    <text x="895" y="331">}</text>
  </g>

  <!-- application core (octagon) -->
  <path d="M456 280 H744 L770 306 V464 L744 490 H456 L430 464 V306 Z" fill="#0E1A30" stroke="url(#accent2)" stroke-width="2.5"/>
  <text x="600" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#E9EFF9">application</text>
  <text x="600" y="340" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7E8DA8">use case — index a repository</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9FD8CE" text-anchor="middle">
    <rect x="460" y="356" width="280" height="30" rx="6" fill="#0A1526" stroke="#31456E"/>
    <text x="600" y="376">«RepositoryFetcher»</text>
    <rect x="460" y="396" width="280" height="30" rx="6" fill="#0A1526" stroke="#31456E"/>
    <text x="600" y="416">«SourceParser»</text>
    <rect x="460" y="436" width="280" height="30" rx="6" fill="#0A1526" stroke="#31456E"/>
    <text x="600" y="456">«GraphSnapshotRepository»</text>
  </g>

  <!-- api -> core -->
  <polyline points="290,300 360,300 360,330 426,330" stroke="#64748B" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <!-- core -> response -->
  <line x1="770" y1="330" x2="876" y2="330" stroke="#2DD4BF" stroke-width="1.8" marker-end="url(#arw2)"/>
  <text x="823" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">snapshot</text>

  <!-- port arrows (dashed) -->
  <polyline points="460,371 210,371 210,556" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arw)"/>
  <line x1="600" y1="426" x2="600" y2="556" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <polyline points="740,451 990,451 990,556" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arw)"/>

  <!-- adapter: github -->
  <rect x="60" y="560" width="300" height="150" rx="10" fill="#111C30" stroke="#2A3C61"/>
  <text x="210" y="588" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#FBBF24">ingestion.github</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A9B7D0">
    <text x="80" y="616">GitHubUrlNormalizer</text>
    <text x="80" y="634">IndexingLimits — guardrails</text>
    <text x="80" y="652">GitHubRepositoryFetcher</text>
    <text x="80" y="670">GitHubClient · retry + cache</text>
  </g>

  <!-- adapter: parser -->
  <rect x="450" y="560" width="300" height="150" rx="10" fill="#111C30" stroke="#2A3C61"/>
  <text x="600" y="588" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#2DD4BF">parsing.javascript</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A9B7D0">
    <text x="470" y="616">JavaScriptTypeScriptParser</text>
    <text x="470" y="634">tree-sitter AST walk</text>
    <text x="470" y="652">symbols · call sites · edges</text>
    <text x="470" y="670">graph builder + stable IDs</text>
  </g>

  <!-- adapter: sqlite -->
  <rect x="840" y="560" width="300" height="150" rx="10" fill="#111C30" stroke="#2A3C61"/>
  <text x="990" y="588" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#A5B4FC">persistence.sqlite</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A9B7D0">
    <text x="860" y="616">SQLiteGraphSnapshotRepository</text>
    <text x="860" y="634">Flyway V1 schema</text>
    <text x="860" y="652">snapshot upsert + lookup</text>
  </g>

  <!-- external chips -->
  <line x1="210" y1="710" x2="210" y2="746" stroke="#64748B" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="60" y="750" width="300" height="54" rx="10" fill="#0F1B31" stroke="#31456E" stroke-dasharray="7 5"/>
  <text x="210" y="772" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E9EFF9">GitHub REST API</text>
  <text x="210" y="791" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">external · GITHUB_TOKEN optional</text>

  <line x1="990" y1="710" x2="990" y2="746" stroke="#64748B" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="840" y="750" width="300" height="54" rx="10" fill="#0F1B31" stroke="#31456E" stroke-dasharray="7 5"/>
  <text x="990" y="772" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E9EFF9">SQLite file</text>
  <text x="990" y="791" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">default ./data/tracemap.db</text>

  <text x="600" y="782" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5B6B8C">GITHUB_TOKEN · tracemap.* config keys</text>
</svg>
