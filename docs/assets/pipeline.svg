<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartograph indexing pipeline: URL in, fetch, parse, resolve, snapshot, graph out">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <marker id="arw3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <style>
      @keyframes march { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -32; } }
      @keyframes stagePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      .flow { stroke-dasharray: 6 10; animation: march 1.1s linear infinite; }
      .stage { animation: stagePulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .flow, .stage { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg3)"/>
  <text x="600" y="36" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#E9EFF9">Indexing pipeline — one synchronous call today, async jobs in Wave 4</text>

  <g>
    <rect x="70" y="60" width="150" height="118" rx="12" fill="#111C30" stroke="#2A3C61"/>
    <circle class="stage" style="animation-delay:0s" cx="145" cy="92" r="16" fill="#0A1526" stroke="#8AA0C4" stroke-width="1.8"/>
    <text x="145" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#8AA0C4">1</text>
    <text x="145" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">URL in</text>
    <text x="145" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">repositoryUrl</text>
    <text x="145" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">validated · normalized</text>

    <rect x="252" y="60" width="150" height="118" rx="12" fill="#111C30" stroke="#2A3C61"/>
    <circle class="stage" style="animation-delay:.2s" cx="327" cy="92" r="16" fill="#0A1526" stroke="#FBBF24" stroke-width="1.8"/>
    <text x="327" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#FBBF24">2</text>
    <text x="327" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Fetch</text>
    <text x="327" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">GitHub API</text>
    <text x="327" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">caps · retry · cache</text>

    <rect x="434" y="60" width="150" height="118" rx="12" fill="#111C30" stroke="#2A3C61"/>
    <circle class="stage" style="animation-delay:.4s" cx="509" cy="92" r="16" fill="#0A1526" stroke="#818CF8" stroke-width="1.8"/>
    <text x="509" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#818CF8">3</text>
    <text x="509" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Parse</text>
    <text x="509" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">tree-sitter</text>
    <text x="509" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">JS / TS AST</text>

    <rect x="616" y="60" width="150" height="118" rx="12" fill="#111C30" stroke="#2A3C61"/>
    <circle class="stage" style="animation-delay:.6s" cx="691" cy="92" r="16" fill="#0A1526" stroke="#2DD4BF" stroke-width="1.8"/>
    <text x="691" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2DD4BF">4</text>
    <text x="691" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Resolve</text>
    <text x="691" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">stable node IDs</text>
    <text x="691" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">symbols · call sites</text>

    <rect x="798" y="60" width="150" height="118" rx="12" fill="#111C30" stroke="#2A3C61"/>
    <circle class="stage" style="animation-delay:.8s" cx="873" cy="92" r="16" fill="#0A1526" stroke="#A5B4FC" stroke-width="1.8"/>
    <text x="873" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#A5B4FC">5</text>
    <text x="873" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Snapshot</text>
    <text x="873" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">SQLite</text>
    <text x="873" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">commit-SHA keyed</text>

    <rect x="980" y="60" width="150" height="118" rx="12" fill="#111C30" stroke="#2A3C61"/>
    <circle class="stage" style="animation-delay:1s" cx="1055" cy="92" r="16" fill="#0A1526" stroke="#2DD4BF" stroke-width="1.8"/>
    <text x="1055" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2DD4BF">6</text>
    <text x="1055" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Graph out</text>
    <text x="1055" y="150" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">JSON snapshot</text>
    <text x="1055" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">nodes · edges</text>
  </g>

  <g stroke="#64748B" stroke-width="1.6">
    <line class="flow" x1="224" y1="119" x2="248" y2="119" marker-end="url(#arw3)"/>
    <line class="flow" style="animation-delay:.15s" x1="406" y1="119" x2="430" y2="119" marker-end="url(#arw3)"/>
    <line class="flow" style="animation-delay:.3s" x1="588" y1="119" x2="612" y2="119" marker-end="url(#arw3)"/>
    <line class="flow" style="animation-delay:.45s" x1="770" y1="119" x2="794" y2="119" marker-end="url(#arw3)"/>
    <line class="flow" style="animation-delay:.6s" x1="952" y1="119" x2="976" y2="119" marker-end="url(#arw3)"/>
  </g>

  <rect x="70" y="212" width="1060" height="56" rx="10" fill="#131C2E" stroke="#CA9D3B" stroke-dasharray="7 5"/>
  <text x="600" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#E3C56D">Guardrails: file + byte caps — stable {code, message} errors — retry + response cache — same-SHA snapshots served from cache</text>
</svg>
