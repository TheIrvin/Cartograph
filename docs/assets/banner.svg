<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartograph — paste a GitHub URL and get the real map of your codebase">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111D36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16233D" stroke-width="1"/>
    </pattern>
    <marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.5"/>

  <!-- contour lines (cartography motif) -->
  <g fill="none" stroke="#23406E" stroke-width="1.2" opacity="0.45">
    <path d="M-40 340 C 80 310, 140 370, 260 340 S 420 280, 560 320"/>
    <path d="M-40 370 C 90 340, 150 400, 270 370 S 430 310, 570 350"/>
    <path d="M660 40 C 750 10, 830 70, 930 40 S 1110 0, 1240 50"/>
    <path d="M660 72 C 760 42, 840 102, 940 72 S 1120 32, 1250 82"/>
    <path d="M-40 120 C 60 100, 120 150, 220 130"/>
  </g>

  <!-- compass rose -->
  <g>
    <circle cx="95" cy="120" r="27" fill="#0F1B31" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M95 96 L101 114 L119 120 L101 126 L95 144 L89 126 L71 120 L89 114 Z" fill="url(#accent)"/>
    <circle cx="95" cy="120" r="3.2" fill="#0B1220"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="142" y="138" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#F1F5FB" letter-spacing="1">Cartograph</text>
  <text x="74" y="196" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#B9C6DD">Paste a GitHub URL — get the real map of your codebase.</text>
  <text x="74" y="224" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7E8DA8">AST-derived call graphs · accurate, not hallucinated · open roadmap</text>

  <!-- tech chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9FD8CE" text-anchor="middle">
    <rect x="74" y="252" width="92" height="30" rx="8" fill="#101B33" stroke="#2C4165"/>
    <text x="120" y="272">Java 17</text>
    <rect x="182" y="252" width="152" height="30" rx="8" fill="#101B33" stroke="#2C4165"/>
    <text x="258" y="272">Spring Boot 3.5</text>
    <rect x="350" y="252" width="110" height="30" rx="8" fill="#101B33" stroke="#2C4165"/>
    <text x="405" y="272">tree-sitter</text>
    <rect x="476" y="252" width="86" height="30" rx="8" fill="#101B33" stroke="#2C4165"/>
    <text x="519" y="272">SQLite</text>
  </g>

  <!-- code-graph motif -->
  <g stroke="#33507E" stroke-width="1.5">
    <line x1="940" y1="110" x2="1050" y2="90"/>
    <line x1="1050" y1="90" x2="1100" y2="160"/>
    <line x1="940" y1="110" x2="1075" y2="240"/>
    <line x1="985" y1="190" x2="1075" y2="240"/>
    <line x1="1075" y1="240" x2="1115" y2="300"/>
    <line x1="930" y1="270" x2="940" y2="110"/>
    <line x1="930" y1="270" x2="1010" y2="320"/>
    <line x1="1100" y1="160" x2="985" y2="190"/>
    <line x1="930" y1="270" x2="940" y2="110" stroke-dasharray="4 4"/>
  </g>
  <!-- traced path -->
  <polyline points="940,110 985,190 1010,320" stroke="#2DD4BF" stroke-width="2.5" fill="none" opacity="0.9" marker-end="url(#arwT)"/>
  <g>
    <circle cx="940" cy="110" r="21" fill="#2DD4BF" opacity="0.14"/><circle cx="940" cy="110" r="15" fill="#2DD4BF"/>
    <circle cx="1050" cy="90" r="17" fill="#818CF8" opacity="0.14"/><circle cx="1050" cy="90" r="11" fill="#818CF8"/>
    <circle cx="1100" cy="160" r="15" fill="#FBBF24" opacity="0.14"/><circle cx="1100" cy="160" r="9" fill="#FBBF24"/>
    <circle cx="985" cy="190" r="19" fill="#5EEAD4" opacity="0.14"/><circle cx="985" cy="190" r="13" fill="#5EEAD4"/>
    <circle cx="1075" cy="240" r="16" fill="#818CF8" opacity="0.14"/><circle cx="1075" cy="240" r="10" fill="#818CF8"/>
    <circle cx="930" cy="270" r="14" fill="#94A3B8" opacity="0.14"/><circle cx="930" cy="270" r="8" fill="#94A3B8"/>
    <circle cx="1010" cy="320" r="17" fill="#2DD4BF" opacity="0.14"/><circle cx="1010" cy="320" r="11" fill="#2DD4BF"/>
    <circle cx="1115" cy="300" r="13" fill="#FBBF24" opacity="0.14"/><circle cx="1115" cy="300" r="7" fill="#FBBF24"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">
    <text x="900" y="86">app.ts</text>
    <text x="1072" y="132">router.ts</text>
    <text x="946" y="352">db.ts</text>
  </g>

  <!-- footer command -->
  <text x="74" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#4E639B">$ curl -X POST /api/v1/index -d '{"repositoryUrl": "https://github.com/owner/repo"}'</text>
</svg>
