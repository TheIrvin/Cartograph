<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartograph request and cache flow — live: the index request is served from SQLite snapshots on a hit; on a miss it fetches sources, parses them with tree-sitter, and persists the graph">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arwBT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2DD4BF"/>
    </marker>
    <style>
      @keyframes sigB { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
      @keyframes marchB { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -24; } }
      @keyframes haloB { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.26; } }
      .signalB { animation: sigB 3s linear infinite; }
      .flowB { stroke-dasharray: 6 12; animation: marchB 1s linear infinite; }
      .haloB { animation: haloB 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .signalB, .flowB, .haloB { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="640" fill="url(#bgB)"/>

  <!-- edges -->
  <line x1="260" y1="238" x2="450" y2="238" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arwBT)"/>
  <text x="355" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8AA0C4">index</text>

  <line class="flowB" x1="550" y1="200" x2="550" y2="132" stroke="#64748B" stroke-width="1.6" marker-end="url(#arwB)"/>
  <text x="562" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">lookup / save</text>

  <line class="flowB" x1="550" y1="276" x2="550" y2="400" stroke="#64748B" stroke-width="1.6" marker-end="url(#arwB)"/>
  <text x="562" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">resolve; miss: fetch</text>

  <line x1="455" y1="436" x2="270" y2="436" stroke="#64748B" stroke-width="1.6" marker-end="url(#arwB)"/>
  <text x="362" y="424" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">HTTPS</text>

  <line x1="650" y1="238" x2="830" y2="238" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arwBT)"/>
  <text x="740" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8AA0C4">miss: build</text>

  <line class="flowB" x1="925" y1="276" x2="925" y2="400" stroke="#64748B" stroke-width="1.6" marker-end="url(#arwB)"/>
  <text x="937" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7E8DA8">parse files</text>

  <!-- traveling miss-path signal: api -> service -> builder -->
  <polyline class="signalB" points="260,238 830,238" stroke="#B7FBF0" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-dasharray="28 192"/>

  <!-- store (top) -->
  <rect class="haloB" x="498" y="44" width="224" height="88" rx="12" fill="#A5B4FC"/>
  <rect x="510" y="56" width="200" height="76" rx="10" fill="#1E1B3A" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="610" y="86" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">SQLite snapshots</text>
  <text x="610" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#A5B4FC">Repository + commit key</text>

  <!-- main row -->
  <rect x="80" y="200" width="180" height="76" rx="10" fill="#0F2A26" stroke="#2DD4BF" stroke-width="1.8"/>
  <text x="170" y="230" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Index API</text>
  <text x="170" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5EEAD4">POST /api/v1/index</text>

  <rect x="450" y="200" width="200" height="76" rx="10" fill="#0F2A26" stroke="url(#accentB)" stroke-width="2.2"/>
  <text x="550" y="230" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Index service</text>
  <text x="550" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#94A3B8">cache-first orchestration</text>

  <rect x="830" y="200" width="190" height="76" rx="10" fill="#0F2A26" stroke="#2DD4BF" stroke-width="1.8"/>
  <text x="925" y="230" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">Graph builder</text>
  <text x="925" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5EEAD4">Stable IDs + warnings</text>

  <!-- bottom row -->
  <rect x="80" y="400" width="190" height="76" rx="10" fill="#111C30" stroke="#475569" stroke-width="1.8"/>
  <text x="175" y="430" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">GitHub REST API</text>
  <text x="175" y="452" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7E8DA8">Tree + supported content</text>

  <rect x="455" y="400" width="190" height="76" rx="10" fill="#0F2A26" stroke="#2DD4BF" stroke-width="1.8"/>
  <text x="550" y="430" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">GitHub ingestion</text>
  <text x="550" y="452" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5EEAD4">Ref resolution + limits</text>

  <rect x="830" y="400" width="190" height="76" rx="10" fill="#0F2A26" stroke="#2DD4BF" stroke-width="1.8"/>
  <text x="925" y="430" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E9EFF9">tree-sitter parser</text>
  <text x="925" y="452" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5EEAD4">JavaScript + TypeScript</text>

  <!-- legend + note -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94A3B8">
    <rect x="80" y="530" width="26" height="16" rx="5" fill="#0F2A26" stroke="#2DD4BF"/>
    <text x="114" y="543">Backend 4</text>
    <rect x="220" y="530" width="26" height="16" rx="5" fill="#1E1B3A" stroke="#A5B4FC"/>
    <text x="254" y="543">Database 1</text>
    <rect x="360" y="530" width="26" height="16" rx="5" fill="#111C30" stroke="#475569"/>
    <text x="394" y="543">External 1</text>
  </g>
  <text x="600" y="543" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4E639B">live render · interactive: docs/diagrams/cartograph-cache-flow.html</text>
  <text x="600" y="575" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#7E8DA8">A stored snapshot for the same commit bypasses downloads and parsing entirely — only misses touch GitHub or tree-sitter.</text>
</svg>
