spring:
  application:
    name: tracemap
  datasource:
    url: jdbc:sqlite:./data/tracemap.db
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

tracemap:
  github-token: ${GITHUB_TOKEN:}
  indexing:
    max-files: 10000
    max-total-bytes: 1073741824
    max-file-bytes: 10485760
