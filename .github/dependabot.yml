version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Version PRs disabled: merged via the GitHub button they would be
    # authored by dependabot[bot] and pollute the contributors graph.
    # Dependency bumps are applied manually as maintainer-authored commits.
    open-pull-requests-limit: 0
    ignore:
      # Spring Boot 4 is a deliberate migration, not a routine bump (pinned 3.5.x)
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        versions: [">=4.0.0"]
    groups:
      patch-updates:
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
